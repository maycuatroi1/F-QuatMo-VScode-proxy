version: '3.8'

# Secrets are NOT stored in this file. Put them in a .env file next to it
# (git-ignored) or in the Dokploy "Environment" panel. See .env.example.
services:
  quatmo-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quatmo-proxy
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
    volumes:
      - ./logs:/app/logs
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: quatmo-redis
    restart: always
    # No "ports:" mapping: Redis is reachable only on the internal Docker network.
    command: >
      redis-server --appendonly yes --appendfsync everysec --save 60 1
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --rename-command CONFIG ""
      --rename-command FLUSHALL ""
      --rename-command DEBUG ""
    volumes:
      - redis_data:/data

volumes:
  redis_data:
    driver: local
